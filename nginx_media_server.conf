# Nginx configuration for the local direct-play media server
# Place this in /etc/nginx/sites-available/ and symlink to /etc/nginx/sites-enabled/.
# Replace `server_name` and adjust `proxy_pass` if your Django service listens somewhere else.

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/media_server_access.log;
    error_log /var/log/nginx/media_server_error.log;

    location /media/ {
        alias /var/www/html/media/;
        add_header Accept-Ranges bytes;
        try_files $uri $uri =404;
    }

    location /static/ {
        alias /var/www/html/static/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
